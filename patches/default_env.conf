# Default environment variables built into the driver (read by
# 20-default-env.py at build time). For emulators and launchers that have no
# environment-variable setting.
#
# One NAME=VALUE per line. Lines starting with # are ignored.
# A value set by the app/emulator or a debug.mesa.* property still wins;
# these only fill in what nothing else set.
#
# Examples:
#   TU_DEBUG=sysmem
#   IR3_SHADER_DEBUG=nodescprefetch
#   TU_TEXFAST=0
#   MESA_VK_WSI_PRESENT_MODE=mailbox


# v5.5: upstream makes MUTABLE_FORMAT images with swapped formats in their
# format list linear and uncompressed; 30-tu-z-mutable.py keeps them tiled and
# UBWC-compressed (TU_Z_MUTABLE=2). Mario Kart 8's HUD item icon is such an
# image, and it renders correctly on plain upstream Mesa. 0 is the only value
# that restores the linear fallback - 1 drops UBWC but still leaves the image
# tiled, which is not what upstream does.
TU_Z_MUTABLE=0
