# Default environment variables built into the driver (read by
# 20-default-env.py at build time). For emulators and launchers that have no
# environment-variable setting.
#
# One NAME=VALUE per line. Lines starting with # are ignored.
# A value set by the app/emulator or a debug.mesa.* property still wins;
# these only fill in what nothing else set.
#
# Examples:
#   TU_DEBUG=sysmem
#   IR3_SHADER_DEBUG=nodescprefetch
#   TU_TEXFAST=0
#   MESA_VK_WSI_PRESENT_MODE=mailbox


# v5.0: 36-tu-z-sysmem-only.py is off, and it was what forced sysmem on every
# render pass. Upstream's use_sysmem_rendering() still honours TU_DEBUG=sysmem,
# so this keeps the sysmem pipeline (and with it patch 02, which only acts when
# TU_DEBUG(SYSMEM) is set) without any Turnip-Z code. The app, an emulator
# setting or debug.mesa.tu.debug still overrides it.
TU_DEBUG=sysmem
