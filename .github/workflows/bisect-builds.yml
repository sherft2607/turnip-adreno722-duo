name: Turnip A722 bisect builds

# Manual only: five builds, each producing one Adrenotools .adpkg.zip artifact.
# Expects bisect-plan/p1_a722_2ccu_32.patch and bisect-plan/p2_revert_subpass_fence_series.patch
# at the root of this repository.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bisect-builds-${{ github.ref }}
  cancel-in-progress: false

env:
  MESA_URL: https://gitlab.freedesktop.org/mesa/mesa.git
  # r28c first, r27c as fallback (sdkmanager package versions).
  NDK_CANDIDATES: "28.2.13676358 27.2.12479018"
  PLATFORM_SDK: "34"
  P1: p1_a722_2ccu_32.patch
  P2: p2_revert_subpass_fence_series.patch

jobs:
  build:
    name: ${{ matrix.id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: build-1c
            sha: 5842099c6db8f91f91fb4f2e454ebba4139da5f2
            patches: "p1_a722_2ccu_32.patch"
            desc: "5842099c + p1 (A722 2 CCU / tile_align_h 32). Known stable baseline."
          - id: build-1
            sha: 5842099c6db8f91f91fb4f2e454ebba4139da5f2
            patches: ""
            desc: "5842099c stock (A722 1 CCU / tile_align_h 16)."
          - id: build-2
            sha: 70bd17c206a4f4275099f328834f70895b6166df
            patches: "p1_a722_2ccu_32.patch p2_revert_subpass_fence_series.patch"
            desc: "70bd17c2 + p1 + p2 (SUBPASS_FENCE series reverted)."
          - id: build-3
            sha: 70bd17c206a4f4275099f328834f70895b6166df
            patches: "p1_a722_2ccu_32.patch"
            desc: "70bd17c2 + p1 (modern 2-core upstream)."
          - id: build-0
            sha: ed2b00fa28dfc60061e21ecbe2280a49940fb470
            patches: "p1_a722_2ccu_32.patch"
            desc: "ed2b00fa tip + p1 (includes bindless invalidate fix c88b6ebd)."

    env:
      BUILD_ID: ${{ matrix.id }}
      MESA_SHA: ${{ matrix.sha }}
      PATCHES: ${{ matrix.patches }}
      BUILD_DESC: ${{ matrix.desc }}

    steps:
      - name: Checkout this repository (patches)
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Install host packages
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-pip python3-venv git zip unzip file bison flex glslang-tools pkg-config
          python3 -m venv "$HOME/venv"
          "$HOME/venv/bin/pip" install --quiet "meson>=1.4,<2" ninja mako pyyaml packaging
          echo "$HOME/venv/bin" >> "$GITHUB_PATH"

      - name: Install Android NDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKM="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKM" || { echo "sdkmanager not found at $SDKM"; exit 1; }
          (yes || true) | "$SDKM" --licenses > /dev/null || true
          NDK_VER=""
          for v in $NDK_CANDIDATES; do
            if "$SDKM" --install "ndk;$v" > /dev/null; then NDK_VER="$v"; break; fi
            echo "NDK $v unavailable, trying next"
          done
          test -n "$NDK_VER" || { echo "no NDK candidate could be installed"; exit 1; }
          NDK="$SDK_ROOT/ndk/$NDK_VER"
          grep -E "Pkg.Revision" "$NDK/source.properties"
          BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          for t in "aarch64-linux-android${PLATFORM_SDK}-clang" "aarch64-linux-android${PLATFORM_SDK}-clang++" llvm-ar llvm-strip; do
            test -x "$BIN/$t" || { echo "missing NDK tool: $t"; exit 1; }
          done
          echo "NDK_BIN=$BIN" >> "$GITHUB_ENV"

      - name: Fetch Mesa at the target commit
        shell: bash
        run: |
          set -x
          git init -q mesa
          cd mesa
          git remote add origin "$MESA_URL"
          ok=0
          for i in 1 2 3; do
            if git fetch --depth 1 origin "$MESA_SHA"; then ok=1; break; fi
            sleep $((i * 10))
          done
          if [ "$ok" != 1 ]; then
            echo "single-SHA fetch refused; falling back to --shallow-since"
            for i in 1 2 3; do
              if git fetch --shallow-since=2026-08-01 origin main; then ok=1; break; fi
              sleep $((i * 10))
            done
          fi
          test "$ok" = 1
          git checkout -q --detach "$MESA_SHA"
          test "$(git rev-parse HEAD)" = "$MESA_SHA"
          git log -1 --format='%H %cd %s'

      - name: Apply patches
        shell: bash
        working-directory: mesa
        run: |
          for p in $PATCHES; do
            src="$GITHUB_WORKSPACE/repo/bisect-plan/$p"
            test -f "$src" || { echo "missing patch: $src"; exit 1; }
            # Windows checkouts may have turned the patch into CRLF.
            sed 's/\r$//' "$src" > "$RUNNER_TEMP/$p"
            git apply --check "$RUNNER_TEMP/$p"
            git apply "$RUNNER_TEMP/$p"
            echo "applied $p"
          done
          git status --short

      - name: Write Meson cross file
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/android-aarch64" <<EOF
          [constants]
          bin = '$NDK_BIN'

          [binaries]
          ar = bin / 'llvm-ar'
          c = [bin / 'aarch64-linux-android${PLATFORM_SDK}-clang']
          cpp = [bin / 'aarch64-linux-android${PLATFORM_SDK}-clang++', '-fno-exceptions', '-fno-unwind-tables', '-fno-asynchronous-unwind-tables', '--start-no-unused-arguments', '-static-libstdc++', '--end-no-unused-arguments']
          c_ld = 'lld'
          cpp_ld = 'lld'
          strip = bin / 'llvm-strip'

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8'
          endian = 'little'
          EOF
          cat "$RUNNER_TEMP/android-aarch64"

      - name: Configure and build Turnip (KGSL)
        shell: bash
        working-directory: mesa
        run: |
          meson setup build-android-aarch64 \
            --cross-file "$RUNNER_TEMP/android-aarch64" \
            -Dbuildtype=release \
            -Dplatforms=android \
            -Dplatform-sdk-version="$PLATFORM_SDK" \
            -Dandroid-stub=true \
            -Dandroid-libbacktrace=disabled \
            -Degl=disabled \
            -Dgallium-drivers= \
            -Dvulkan-drivers=freedreno \
            -Dfreedreno-kmds=kgsl
          meson compile -C build-android-aarch64

      - name: Strip, rename and package
        shell: bash
        run: |
          set -e
          LIB="$(find mesa/build-android-aarch64 -name libvulkan_freedreno.so | head -n 1)"
          test -n "$LIB" || { echo "libvulkan_freedreno.so not found"; exit 1; }
          rm -rf pkg out && mkdir pkg out
          cp "$LIB" pkg/libvulkan_freedreno.so
          "$NDK_BIN/llvm-strip" --strip-unneeded pkg/libvulkan_freedreno.so
          file pkg/libvulkan_freedreno.so
          file pkg/libvulkan_freedreno.so | grep -q "ARM aarch64"
          ls -l pkg/libvulkan_freedreno.so

          SHORT="${MESA_SHA:0:8}"
          export META_NAME="Turnip A722 - ${BUILD_ID}"
          export META_DESC="${BUILD_DESC} Mesa ${SHORT}. Patches: ${PATCHES:-none}."
          python3 - <<'PY'
          import json, os
          meta = {
              "schemaVersion": 1,
              "name": os.environ["META_NAME"],
              "description": os.environ["META_DESC"],
              "author": "sherft2607",
              "packageVersion": "1.0",
              "vendor": "Mesa",
              "driverVersion": "Mesa 26.3.0-devel",
              "minApi": 28,
              "libraryName": "libvulkan_freedreno.so",
          }
          with open("pkg/meta.json", "w") as f:
              json.dump(meta, f, indent=2)
              f.write("\n")
          PY
          python3 -c "import json; json.load(open('pkg/meta.json'))"
          cat pkg/meta.json

          ZIP="out/turnip-a722-${BUILD_ID}-${SHORT}.adpkg.zip"
          (cd pkg && zip -9 -X "../$ZIP" libvulkan_freedreno.so meta.json)
          unzip -l "$ZIP"
          (cd out && sha256sum "$(basename "$ZIP")" | tee "$(basename "$ZIP").sha256")

          # Informational only: which loader entry points does this build export?
          "$NDK_BIN/llvm-nm" -D --defined-only pkg/libvulkan_freedreno.so | grep -E "HMI|vk_icd|vkGetInstanceProcAddr" || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.id }}
          path: out/*
          if-no-files-found: error
          retention-days: 14
